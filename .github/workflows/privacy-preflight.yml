# Updated October 4, 2026 · Build 2
name: Public docs checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install documentation check dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Validate documentation and report forms
        run: python agents/tools/validate_public_repo.py

      - name: Run privacy and documentation tests
        run: python -m unittest discover -s agents/tools/tests -v

      - name: Audit pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python agents/tools/privacy_preflight.py push --upstream "origin/$BASE_REF"

      - name: Audit full fetched repository history
        run: python agents/tools/privacy_preflight.py remote-history

      - name: Build portable static documentation
        run: python agents/tools/build_docs.py
